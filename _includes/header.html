<header class="border-b border-zinc-200">
    <div class="max-w-4xl mx-auto flex items-center justify-between px-4 py-4">      
      <div>
        <a href="{{ '/' | relative_url }}" class="text-xl font-normal text-gray-500 hover:text-gray-800 hover:text-black">
          {% if page.title != "Home" %}
            {{ site.title }}
          {% else %}
            &nbsp; <!-- Empty space to maintain layout consistency -->
          {% endif %}
        </a>        
      </div>
      <div>
      <nav class="space-x-3 font-normal text-gray-500">
        <a class="{% if page.title == 'Projects' %}text-blue-900 bg-blue-50 underline{% else %}hover:text-blue-900 hover:underline {% endif %} hover:bg-blue-100 rounded-md p-2" href="{{ '/projects' | relative_url }}">Projects</a>
        <a class="{% if page.title == 'Publications' %}text-blue-900 bg-blue-50 underline{% else %}hover:text-blue-900 hover:underline{% endif %} hover:bg-blue-100 rounded-md p-2" href="{{ '/publications' | relative_url }}">Publications</a>           
      </nav>
      </div>
    </div>
  </header>

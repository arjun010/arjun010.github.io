<p class="font-normal text-gray-400 group-hover:text-gray-700">
    {% for author in include.authors %}
        <span class="{% if author == 'Arjun Srinivasan' %}text-gray-600 font-normal group-hover:text-black{% endif %}">
            {{ author }}{% unless forloop.last %},{% endunless %}
        </span>
    {% endfor %}
</p>

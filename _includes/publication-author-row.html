<p class="font-normal text-gray-400 group-hover:text-gray-800">
    {% for author in publication.authors %}
        <span class="{% if author == 'Arjun Srinivasan' or author == 'Arjun Srinivasan*'  %}text-gray-800 font-normal group-hover:text-black{% endif %}">
            {{ author }}{% unless forloop.last %},{% endunless %}
        </span>        
    {% endfor %}
    {% if publication.equal_contribution==true %}
        <span class="px-1 text-gray-400 group-hover:text-gray-500">(*equal contribution)</span>
    {% endif %}
</p>

<div class="project-item border border-gray-300 rounded-md p-4 space-y-4 hover:shadow-sm hover:shadow-gray-500">
    <!-- Project Image -->
    <img src="{{ project.image }}" alt="{{ project.title }}" class="w-full h-48 object-cover rounded-md">

    <!-- Project Title -->
    <h2 class="text-xl font-semibold text-gray-800">{{ project.title }}</h2>

    <!-- Project Description -->
    <p class="text-gray-600 text-sm">{{ project.description }}</p>

    <!-- Icons at the Bottom -->
    {% if project.materials %}
        {% include info-row.html materials=project.materials priority_keys="project,demo,video,talk,code" %}
    {% endif %}
</div>

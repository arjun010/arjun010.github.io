<div class="publication-item space-y-1 border border-transparent hover:shadow-sm hover:bg-gray-50 hover:shadow-gray-500 hover:rounded-sm transition duration-200 p-4">
    <h2 class="text-md font-normal">{{ publication.title }}</h2>
    <div class="space-y-1 text-sm">
        <p class="text-gray-600">{{ publication.authors | join: ', ' }}</p>
        <p class="text-gray-600">{{ publication.venue | join: ', ' }}</p>
    </div>
    <p class="text-sm">Icons + links</p>
</div>
